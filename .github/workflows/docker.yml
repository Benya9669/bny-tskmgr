name: Test, build and release TaskFlow

on:
  pull_request:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: taskflow-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: benya9669/bny-tskmgr

jobs:
  test:
    name: Validate and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate immutable signed release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "release tag must use vX.Y.Z format" >&2
            exit 1
          fi
          git cat-file -p "$GITHUB_REF_NAME" | grep -q -- '-----BEGIN PGP SIGNATURE-----'
          expected_version="${GITHUB_REF_NAME#v}"
          actual_version="$(tr -d '\r\n' < VERSION)"
          if [[ "$actual_version" != "$expected_version" ]]; then
            echo "VERSION is ${actual_version}, expected ${expected_version}" >&2
            exit 1
          fi
          bash scripts/extract-release-notes.sh \
            "$GITHUB_REF_NAME" \
            CHANGELOG.md \
            release-notes.md

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Run API tests
        run: python -m unittest discover -v

      - name: Check source and API contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile app/server.py app/backup.py tests/smtp_sink.py
          node --check web/app.js
          python -m json.tool docs/openapi.json >/dev/null

      - name: Validate Compose files
        shell: bash
        run: |
          set -euo pipefail
          docker compose --env-file .env.example config --quiet
          docker compose --env-file .env.example -f compose.release.yaml config --quiet

  docker:
    name: Build and optionally publish image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Resolve image version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="sha-${GITHUB_SHA::12}"
          fi
          echo "value=${version}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: startsWith(github.ref, 'refs/tags/v')
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reject an existing immutable release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release already exists; published releases are immutable" >&2
            exit 1
          fi
          if docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.version.outputs.value }}" >/dev/null 2>&1; then
            echo "container tag already exists; published images are immutable" >&2
            exit 1
          fi

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and optionally publish image
        id: image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ startsWith(github.ref, 'refs/tags/v') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TASKFLOW_VERSION=${{ steps.version.outputs.value }}
          cache-from: type=gha,scope=taskflow
          cache-to: type=gha,mode=max,scope=taskflow
          provenance: mode=max
          sbom: true

      - name: Install Cosign
        if: startsWith(github.ref, 'refs/tags/v')
        uses: sigstore/cosign-installer@v3

      - name: Sign published image with GitHub OIDC
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          set -euo pipefail
          cosign sign --yes \
            "${REGISTRY}/${IMAGE_NAME}@${{ steps.image.outputs.digest }}"

      - name: Attest image provenance
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true

      - name: Create GitHub Release from changelog
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/extract-release-notes.sh \
            "$GITHUB_REF_NAME" \
            CHANGELOG.md \
            release-notes.md
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --notes-file release-notes.md \
            --title "TaskFlow ${{ steps.version.outputs.value }}"
